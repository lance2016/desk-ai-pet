[package]
name = "ai-pet"
version = "1.19.1"
description = "A desktop pet that lives on your screen"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "ai_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ring = "0.17"
base64 = "0.22"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: Claude Code's settings file keeps its key order when the pet adds its hooks.
serde_json = { version = "1", features = ["preserve_order"] }
# `bundled`: SQLite is compiled in, so the app does not depend on the system's copy.
rusqlite = { version = "0.37", features = ["bundled"] }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# 3.x: the 2.x parser rejects the untagged `* ID` reply that 163 requires.
imap = "=3.0.0-alpha.15"
native-tls = "0.2"
# GBK and GB18030, common in Chinese mail, need `full_encoding`.
mail-parser = { version = "1.0", features = ["full_encoding"] }
log = "0.4"
tauri-plugin-log = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "objc2-core-foundation", "NSAlert", "NSAnimation", "NSAnimationContext", "NSApplication", "NSBox", "NSButton", "NSColor", "NSControl", "NSGraphics", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
